# Builds an unsigned .ipa on a GitHub macOS runner. Run it from the Actions tab
# ("Run workflow"), then download the .ipa from the run's Artifacts section.
name: Unsigned iOS build

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned .ipa
        run: bash scripts/build-unsigned-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LockScreen-unsigned-ipa
          path: ios/build/LockScreen-unsigned.ipa
